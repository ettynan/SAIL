# Grafana Alloy: read-only host systemd journal collection.
# Separate Helm release: sail-alloy-system

controller:
  type: daemonset

  volumes:
    extra:
      - name: journal-persistent
        hostPath:
          path: /var/log/journal
          type: Directory

      - name: journal-runtime
        hostPath:
          path: /run/log/journal
          type: Directory

      - name: machine-id
        hostPath:
          path: /etc/machine-id
          type: File

      - name: alloy-storage
        emptyDir: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 473
  runAsGroup: 473
  supplementalGroups:
    - 999  # systemd-journal group on all three SAIL nodes
  seccompProfile:
    type: RuntimeDefault

alloy:
  enableReporting: false
  storagePath: /tmp/alloy

  mounts:
    varlog: false
    extra:
      - name: journal-persistent
        mountPath: /var/log/journal
        readOnly: true

      - name: journal-runtime
        mountPath: /run/log/journal
        readOnly: true

      - name: machine-id
        mountPath: /etc/machine-id
        readOnly: true

      - name: alloy-storage
        mountPath: /tmp/alloy

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

  configMap:
    create: true
    content: |
      loki.relabel "journal" {
        forward_to = []

        rule {
          source_labels = ["__journal__systemd_unit"]
          target_label  = "unit"
        }

        rule {
          source_labels = ["__journal_syslog_identifier"]
          target_label  = "syslog_identifier"
        }

        rule {
          source_labels = ["__journal_priority"]
          target_label  = "priority"
        }
      }

      loki.source.journal "host" {
        max_age       = "10m"
        labels        = {
          node   = sys.env("NODE_NAME"),
          source = "systemd-journal",
        }
        relabel_rules = loki.relabel.journal.rules
        forward_to    = [loki.process.host.receiver]
      }

      loki.process "host" {
        // Retain warnings/errors (priority 0-4) from all services.
        // Retain SSH authentication events at any priority.
        // Drop routine SSH messages at priorities 5-7.

        stage.match {
          selector = "{syslog_identifier=~\"sshd|sshd-session\",priority=~\"[5-7]\"} !~ \"(?i)(accepted|failed password|failed publickey|invalid user|authentication failure|session opened|session closed)\""
          action   = "drop"
        }

        // Drop other informational, notice, and debug events.
        stage.match {
          selector = "{syslog_identifier!~\"sshd|sshd-session\",priority=~\"[5-7]\"}"
          action   = "drop"
        }

        forward_to = [loki.write.sail.receiver]
      }

      loki.write "sail" {
        endpoint {
          url       = "http://sail-loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
          tenant_id = "local"
        }
      }