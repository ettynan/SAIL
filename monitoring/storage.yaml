
apiVersion: v1
kind: PersistentVolume
metadata:
  name: sail-prometheus-pv
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: sail-monitoring-local
  local:
    path: /mnt/sail-storage/monitoring/prometheus
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - pi-node-1
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: sail-loki-pv
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: sail-monitoring-local
  local:
    path: /mnt/sail-storage/monitoring/loki
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - pi-node-1
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: sail-monitoring-local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
