
# Helm chart: grafana/loki 7.5.0

deploymentMode: SingleBinary

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1024Mi
  persistence:
    enabled: true
    storageClass: sail-monitoring-local
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    selector:
      matchLabels:
        sail.workload: loki

read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0

loki:
  commonConfig:
    replication_factor: 1
  limits_config:
    retention_period: 168h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

# Optional components disabled for SAIL's resource-limited cluster
chunksCache:
  enabled: false

resultsCache:
  enabled: false