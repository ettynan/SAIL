
# Helm chart: prometheus-community/kube-prometheus-stack 92.14.1
# SAIL monitoring Helm configuration.
prometheus:
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - prometheus.sail.test
    paths:
      - /
    pathType: Prefix
    tls:
      - secretName: sail-monitoring-tls
        hosts:
          - prometheus.sail.test
  prometheusSpec:
    replicas: 1
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1536Mi
    retention: 15d
    retentionSize: 15GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: sail-monitoring-local
          accessModes:
            - ReadWriteOnce
          selector:
            matchLabels:
              sail.workload: prometheus
          resources:
            requests:
              storage: 20Gi

grafana:
  admin:
    existingSecret: sail-grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  grafana.ini:
    auth.anonymous:
      enabled: false
    users:
      allow_sign_up: false
    auth.basic:
      enabled: true
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.sail.test
    path: /
    pathType: Prefix
    tls:
      - secretName: sail-monitoring-tls
        hosts:
          - grafana.sail.test
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    type: pvc
    storageClassName: sail-nfs
    accessModes:
      - ReadWriteOnce
    size: 2Gi
  
  initChownData:
    enabled: false

  securityContext:
    runAsNonRoot: true
    runAsUser: 472
    runAsGroup: 472
    fsGroup: null

  containerSecurityContext:
    allowPrivilegeEscalation: false
    privileged: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

alertmanager:
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - alertmanager.sail.test
    paths:
      - /
    pathType: Prefix
    tls:
      - secretName: sail-monitoring-tls
        hosts:
          - alertmanager.sail.test
  alertmanagerSpec:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: sail-nfs
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi

prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

nodeExporter:
  resources:
    requests:
      cpu: 30m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
