
name: SAIL Orbit CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

jobs:
  python-checks:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: sail-orbit

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sail-orbit/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Black formatting
        run: black --check .

      - name: Run Ruff
        run: ruff check .

  frontend-checks:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: sail-orbit/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sail-orbit/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
